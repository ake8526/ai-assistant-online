# BACKUP scheduler only. The primary one is the Cloudflare Worker in
# cloudflare/ — see docs/morning-delivery-plan.md.
#
# Measured 4–13 Aug 2026: GitHub ran this ~12–17 times per DAY even though it
# asked for every 5 min, and the first morning run never landed before 07:37 BKK
# (the "50,55 23" entry never fired at all). High-frequency schedules are
# deprioritised on shared runners, so this can only ever be a catch-up net.
#
# Requires repo secret CRON_SECRET (= Vercel CRON_SECRET). Times are UTC (BKK = UTC+7).
# News and brief are separate HTTP calls so a slow digest cannot starve the
# agenda. Brief is ALWAYS last — it has LINE quick-reply number buttons.
name: scheduled-jobs

on:
  schedule:
    # 07:00–20:55 BKK — ask for every 10 min and treat every run as a catch-up
    - cron: "*/10 0-13 * * *"
  workflow_dispatch: {}

env:
  BASE: https://ktis-ai-assistant.vercel.app

jobs:
  scheduled:
    runs-on: ubuntu-latest
    if: ${{ vars.CRON_ENABLED != 'false' }}
    steps:
      # 1) News first
      - name: Morning news only
        run: |
          curl -sS -m 280 -X POST \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            "$BASE/api/brief/run?only=news" | head -c 1500

      - name: News digest backup
        run: |
          curl -sS -m 280 -X POST \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            "$BASE/api/digest/push" | head -c 1000

      # 2) Agenda LAST — quick-reply buttons stay on the newest message
      - name: Morning brief only (calendar → LINE)
        run: |
          curl -sS -m 90 -X POST \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            "$BASE/api/brief/run?only=brief" | head -c 1500

      - name: Morning brief retry
        run: |
          curl -sS -m 90 -X POST \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            "$BASE/api/brief/run?only=brief" | head -c 1000

      - name: Meeting summaries (Mon-Fri, 08:00-19:45 BKK only)
        run: |
          H=$(date -u +%H); D=$(date -u +%u)
          if [ "$D" -le 5 ] && [ "$H" -ge 1 ] && [ "$H" -le 12 ]; then
            curl -sS -m 280 -X POST \
              -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
              "$BASE/api/summaries/run" | head -c 1000
          else
            echo "skip summaries (outside window)"
          fi

      - name: Task reminders (top of hour, Mon-Fri 08:00-19:45 BKK)
        run: |
          MIN=$(date -u +%M); H=$(date -u +%H); D=$(date -u +%u)
          if [ "$MIN" -lt 5 ] && [ "$D" -le 5 ] && [ "$H" -ge 1 ] && [ "$H" -le 12 ]; then
            curl -sS -m 60 -X POST \
              -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
              "$BASE/api/reminders/run" | head -c 1000
          else
            echo "skip reminders (not top of hour / outside window)"
          fi

      - name: New calendar appointments → LINE
        run: |
          curl -sS -m 120 -X POST \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            "$BASE/api/calendar/notify" | head -c 1000
